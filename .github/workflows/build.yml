name: Build

on:
  schedule:
    - cron: '0 10,11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run manually or at 3:00 AM Pacific
        id: gate
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pacific_hour="$(TZ=America/Los_Angeles date +'%H')"
          if [[ "$pacific_hour" == "03" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This scheduled run is not at 3:00 AM Pacific; skipping the build."
          fi

  validate:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Arch configuration
        run: |
          set -euo pipefail
          grep -Fq 'ID_LIKE=arch' os-release
          grep -Fq 'VERSION="Rolling"' os-release
          grep -Fq 'firefox' archiso/packages
          grep -Fq 'thunderbird' archiso/packages
          grep -Fq 'plasma-desktop' archiso/packages
          grep -Fq 'calamares' archiso/packages
          grep -Fq 'Name=Install voltage!os' archiso/airootfs/usr/share/applications/install-voltageos.desktop
          grep -Fq 'Icon=/usr/share/calamares/branding/voltageos/logo.png' archiso/airootfs/usr/share/applications/install-voltageos.desktop
          grep -Fq 'branding: voltageos' archiso/airootfs/root/customize_airootfs.sh
          grep -Fq 'productLogo:     "logo.png"' archiso/airootfs/etc/calamares/branding/voltageos/branding.desc
          cmp -s plymouth/logo.png archiso/airootfs/etc/calamares/branding/voltageos/logo.png
          grep -Fq 'linux-aarch64' archiso/aarch64/packages
          grep -Fq "bootmodes=('uefi.grub')" archiso/aarch64/profile-overrides.sh
          grep -Fq 'User=voltage' archiso/airootfs/etc/sddm.conf.d/10-voltage.conf
          test -x archiso/airootfs/root/customize_airootfs.sh
          test -f archiso/aarch64/linux-aarch64.preset
          test -f archiso/aarch64/pacman.conf
          bash -n archiso/airootfs/root/customize_airootfs.sh
          bash -n archiso/aarch64/profile-overrides.sh
          python3 -c 'import ast; ast.parse(open("archiso/aarch64/patch_grub.py").read())'
          test ! -e fedora-minimal.ks
          test ! -e dnf.conf
          test ! -e kiwi/config.xml

      - name: Check whitespace
        run: git diff --check

  build:
    needs: validate
    name: Build ${{ matrix.arch }} Arch Rolling ISO
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ArchISO on Arch Linux
        if: matrix.arch == 'x86_64'
        run: pacman -Syu --noconfirm archiso

      - name: Install ArchISO on Arch Linux ARM
        if: matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          cp archiso/aarch64/mirrorlist /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Sy --noconfirm --needed archlinuxarm-keyring archlinux-keyring
          pacman-key --populate archlinux
          pacman -Su --noconfirm
          pacman -S --noconfirm --needed \
            arch-install-scripts curl dosfstools e2fsprogs erofs-utils gawk grub \
            libarchive libisoburn mtools mkinitcpio mkinitcpio-archiso \
            python squashfs-tools
          curl --fail --location --retry 5 \
            https://geo.mirror.pkgbuild.com/extra/os/x86_64/extra.db \
            --output /tmp/arch-extra.db
          package="$(
            tar -xOf /tmp/arch-extra.db --wildcards 'archiso-*/desc' \
              | awk 'found { print; exit } $0 == "%FILENAME%" { found = 1 }'
          )"
          test -n "$package"
          curl --fail --location --retry 5 \
            "https://geo.mirror.pkgbuild.com/extra/os/x86_64/$package" \
            --output "/tmp/$package"
          curl --fail --location --retry 5 \
            "https://geo.mirror.pkgbuild.com/extra/os/x86_64/$package.sig" \
            --output "/tmp/$package.sig"
          pacman -U --noconfirm "/tmp/$package"
          python archiso/aarch64/patch_grub.py /usr/bin/mkarchiso

      - name: Prepare ${{ matrix.arch }} profile
        run: |
          set -euo pipefail
          mkdir -p build
          cp -a /usr/share/archiso/configs/releng build/profile
          cp -a archiso/airootfs/. build/profile/airootfs/
          install -Dm644 os-release build/profile/airootfs/etc/os-release
          if [[ '${{ matrix.arch }}' == 'aarch64' ]]; then
            cp archiso/aarch64/packages build/profile/packages.aarch64
            cp archiso/aarch64/pacman.conf build/profile/pacman.conf
            cp archiso/aarch64/mirrorlist build/profile/airootfs/etc/pacman.d/mirrorlist
            cp archiso/aarch64/archiso.conf \
              build/profile/airootfs/etc/mkinitcpio.conf.d/archiso.conf
            mkdir -p build/profile/airootfs/usr/share/voltageos
            cp archiso/aarch64/linux-aarch64.preset \
              build/profile/airootfs/usr/share/voltageos/
            cp archiso/aarch64/grub.cfg build/profile/grub/grub.cfg
            cat archiso/aarch64/profile-overrides.sh >> build/profile/profiledef.sh
          else
            cat archiso/packages >> build/profile/packages.x86_64
          fi
          printf '%s\n' 'file_permissions["/root/customize_airootfs.sh"]="0:0:755"' \
            >> build/profile/profiledef.sh
          sed -i \
            -e 's/^iso_name=.*/iso_name="voltageos"/' \
            -e 's/^iso_label=.*/iso_label="VOLTAGE_ROLLING"/' \
            -e 's/^iso_publisher=.*/iso_publisher="Voltage Studios"/' \
            -e 's/^iso_application=.*/iso_application="voltage!os Arch Linux Rolling live image"/' \
            -e 's/^iso_version=.*/iso_version="Rolling"/' \
            build/profile/profiledef.sh

      - name: Build ${{ matrix.arch }} ISO
        run: |
          set -euo pipefail
          mkdir -p build/work build/out
          mkarchiso -v -w build/work -o build/out build/profile

      - name: Record installed package versions
        run: |
          set -euo pipefail
          dbpath="$(find build/work -type d -path '*/var/lib/pacman/local' -print -quit)"
          test -n "$dbpath"
          pacman -Q --dbpath "$dbpath" | sort \
            > "build/out/voltageos-${{ matrix.arch }}-packages.txt"

      - name: Upload ${{ matrix.arch }} ISO and package versions
        uses: actions/upload-artifact@v4
        with:
          name: voltageos-rolling-${{ matrix.arch }}
          path: build/out/*
          if-no-files-found: error

      - name: Attest ${{ matrix.arch }} ISO provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/out/*.iso

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          export TZ=America/Los_Angeles

          tag="$(date +'%m.%d.%Y-%H.%M')"
          title="$(date +'%b %-d, %Y at %-I:%M %p %Z')"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; refusing to overwrite its release." >&2
            exit 1
          fi

          previous_tag="$(
            git tag --list '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]-[0-9][0-9].[0-9][0-9]' \
              --sort=-creatordate | head -n 1
          )"

          {
            echo "## Installed package versions"
            echo

            for packages in release-assets/voltageos-rolling-*/voltageos-*-packages.txt; do
              [[ -f "$packages" ]] || continue
              arch="${packages##*/voltageos-}"
              arch="${arch%-packages.txt}"

              echo "### $arch"
              echo
              echo '```text'
              cat "$packages"
              echo '```'
              echo
            done

            echo "## Commits since the previous release"
            echo

            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --pretty=format:'- %h %s' "$previous_tag..$GITHUB_SHA"
            else
              echo "_No earlier matching version tag was found; listing repository history._"
              git log --no-merges --pretty=format:'- %h %s' "$GITHUB_SHA"
            fi

            echo
          } > release-notes.md

          mapfile -t isos < <(find release-assets -type f -name '*.iso' -print | sort)
          if [[ "${#isos[@]}" -eq 0 ]]; then
            echo "No ISO files were downloaded; refusing to create a release." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$title" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

          gh release create "$tag" "${isos[@]}" \
            --title "$title" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
