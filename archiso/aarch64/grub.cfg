insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set default=0
set timeout=15

menuentry "voltage!os Rolling (%ARCH%, UEFI)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-aarch64 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-aarch64.img
}
